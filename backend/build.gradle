plugins {
    id 'java-library'
    id 'org.springframework.boot' version '4.0.6'
    id 'nu.studer.jooq' version '9.0'
}

group = 'org.example'
java.sourceCompatibility = JavaVersion.VERSION_21

repositories {
    mavenCentral()
}

dependencies {
    implementation libs.jakarta.persistence.jakarta.persistence.api
    implementation libs.jakarta.validation.jakarta.validation.api

    implementation libs.org.spring.boot.starter.web
    implementation libs.org.spring.boot.starter.security
    implementation libs.org.spring.boot.starter.thymeleaf
    implementation libs.org.spring.boot.starter.jooq
    testImplementation libs.org.spring.boot.starter.test
    testImplementation libs.com.microsoft.playwright

    implementation libs.io.jsonwebtoken.jjwt.api
    runtimeOnly libs.io.jsonwebtoken.jjwt.impl
    runtimeOnly libs.io.jsonwebtoken.jjwt.jackson

    implementation libs.org.postgresql
    jooqGenerator libs.org.postgresql
    jooqGenerator libs.jooq.meta.extensions
}

sourceSets {
    functionalTest {
        java.srcDir 'src/functionalTest/java'
    }
}

configurations {
    functionalTestImplementation.extendsFrom testImplementation
    functionalTestRuntimeOnly.extendsFrom testRuntimeOnly
}

jooq {
    version = libs.versions.jooq.get()
    configurations {
        main {
            generationTool {
                logging = org.jooq.meta.jaxb.Logging.WARN
                generator {
                    name = 'org.jooq.codegen.DefaultGenerator'
                    database {
                        name = 'org.jooq.meta.extensions.ddl.DDLDatabase'
                        properties {
                            property {
                                key = 'scripts'
                                value = 'src/main/resources/init.sql'
                            }
                            property {
                                key = 'defaultNameCase'
                                value = 'lower'
                            }
                        }
                    }
                    generate {
                        records = true
                    }
                    target {
                        packageName = 'org.jooq'
                        directory = 'build/generated-src/jooq'
                    }
                }
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('generateJooq') {
    inputs.file('src/main/resources/init.sql')
    allInputsDeclared = true
    outputs.dir('build/generated-src/jooq')
}

def compileJavaSource(Task task, File inputDir, File outputDir, FileCollection classpath,
                      List<File> additionalSourceDirs = []) {
    if (!inputDir.exists()) {
        println "No Java files found to compile."
        return
    }
    def javaFiles = fileTree(inputDir).matching { include '**/*.java' }
            .files.collect { it.absolutePath }
    for (File additionalDir : additionalSourceDirs) {
        if (additionalDir.exists()) {
            javaFiles.addAll(fileTree(additionalDir).matching { include '**/*.java' }
                    .files.collect { it.absolutePath })
        }
    }
    outputDir.mkdirs()

    task.services.get(ExecOperations).exec {
        commandLine = ['javac', '-d', outputDir.absolutePath, '-cp', classpath.asPath] + javaFiles
    }

}

tasks.register('compile') {
    group = 'custom'
    description = 'Compilation of the project source codes.'
    inputs.files(tasks.named('generateJooq'))
    def javaDir = file('src/main/java')
    inputs.dir(javaDir)
    inputs.files(configurations.compileClasspath)

    def outputDir = file('build/classes/java/main')
    outputs.dir(outputDir)

    doLast {
        compileJavaSource(it,
                javaDir,
                outputDir,
                configurations.compileClasspath,
                [file('build/generated-src/jooq')])
    }
}

tasks.register('compileTests') {
    group = 'custom'
    description = 'Compilation of the test source codes.'
    def testDir = file('src/test/java')
    if (testDir.exists()) {
        inputs.dir(testDir)
    }
    inputs.files(tasks.named('compile'))
    inputs.files(configurations.testCompileClasspath)
    def outputDir = file('build/classes/java/test')
    outputs.dir(outputDir)

    doLast {
        compileJavaSource(it,
                testDir,
                outputDir,
                configurations.testCompileClasspath + tasks.named('compile').get().outputs.files)
    }
}

def runJunitTests(Task task, FileCollection compiledFiles, FileCollection classpath) {
    task.with {
        testClassesDirs = compiledFiles.asFileTree

        delegate.classpath = files(tasks.named('compile').get().outputs.files, compiledFiles, classpath)
        useJUnitPlatform()
        jvmArgs("-XX:+EnableDynamicAgentLoading")

        testLogging {
            events "passed", "skipped", "failed"
            showStandardStreams = true
        }
    }
}

tasks.named('test') {
    runJunitTests(it,
            tasks.named('compileTests').get().outputs.files,
            configurations.testRuntimeClasspath)

    ignoreFailures = false
}

tasks.register('compileFunctionalTests') {
    group = 'custom'
    description = 'Compilation of the functional test source codes.'
    def funcTestDir = file('src/functionalTest/java')
    if (funcTestDir.exists()) {
        inputs.dir(funcTestDir)
    }
    inputs.files(tasks.named('compile'))
    inputs.files(configurations.functionalTestCompileClasspath)
    def outputDir = file('build/classes/java/functionalTest')
    outputs.dir(outputDir)

    doLast {
        compileJavaSource(it,
                funcTestDir,
                outputDir,
                configurations.functionalTestCompileClasspath + tasks.named('compile').get().outputs.files)
    }
}

tasks.register('functionalTest', Test) {
    group = 'custom'
    description = 'Runs the functional tests.'
    inputs.files(tasks.named('bootJar'))
    doFirst {
        startTestDockerEnv(it)
    }
    runJunitTests(it,
            tasks.named('compileFunctionalTests').get().outputs.files,
            configurations.functionalTestRuntimeClasspath)

    finalizedBy tasks.named('dockerTestDown')
}

tasks.named('bootJar') {
    classpath = files(tasks.named('compile'), configurations.runtimeClasspath)
    from('src/main/resources') {
        into('BOOT-INF/classes')
        exclude 'locales/**/*.properties'
    }
    from(tasks.named('native2ascii')) {
        into('BOOT-INF/classes/locales')
    }
    manifest {
        attributes(
                'Manifest-Version': '1.0',
                'Implementation-Version': providers.gradleProperty('app.version').getOrElse('1.0.0'),
                'Start-Class': providers.gradleProperty('main.class.name').get()
        )
    }
}

tasks.register('myClean') {
    group = 'custom'
    description = 'Deletes build classes and all temp files.'
    outputs.upToDateWhen {
        !file('build').exists()
    }
    doLast {
        delete 'build'
    }
}

tasks.register('native2ascii') {
    group = 'custom'
    description = 'Converts localization files like "native2ascii"'
    def sourceDir = file(providers.gradleProperty('locales.input.dir')
            .getOrElse('src/main/resources/locales'))
    inputs.dir(sourceDir)
    def outputDir = file(providers.gradleProperty('locales.output.dir')
            .getOrElse('build/generated-resources/ascii-locales'))
    outputs.dir(outputDir)
    doLast {
        inputs.files.each { File inputFile ->
            def outputFile = new File(outputDir, sourceDir.toPath().relativize(inputFile.toPath()).toString())
            outputFile.parentFile.mkdirs()

            def convertedContent = inputFile.getText('UTF-8').toCharArray().collect { char c ->
                (c > 127) ? String.format("\\u%04x", (c as int)) : c
            }.join("")
            outputFile.write(convertedContent, "ISO-8859-1")
        }
    }
}

tasks.register('myBuild') {
    group = 'custom'
    description = 'Compilation of the project source codes and packaging them into an executable jar archive.'
    inputs.files(tasks.named('test'))
    inputs.files(tasks.named('bootJar'))
    inputs.files(tasks.named('functionalTest'))
    outputs.files(tasks.named('bootJar'))
}

def startTestDockerEnv(Task task) {
    task.services.get(ExecOperations).exec {
        commandLine 'docker-compose', '-f', '../docker-compose.test.yaml', 'up', '-d'
    }
}

tasks.register('dockerTestDown', Exec) {
    group = 'docker'
    description = 'Stops the test docker containers'
    commandLine 'docker-compose', '-f', '../docker-compose.test.yaml', 'down', '-v'
}

tasks.register('diff') {
    group = 'custom'
    description = 'performs a check of the working copy status, and if the changes affect the classes specified in ' +
            'the parameters file, it performs a commit to the git repository.'
    doLast {
        def gitRootDir = projectDir.parentFile
        def checkList = file(providers.gradleProperty('git.classes.file')
                .getOrElse('git-classes.txt')).readLines().findAll { !it.trim().isEmpty() }
        def stdout = new ByteArrayOutputStream()
        services.get(ExecOperations).exec {
            workingDir gitRootDir
            commandLine = ['git', 'status', '--porcelain']
            standardOutput = stdout
        }
        def changedFiles = stdout.toString().trim().readLines().collect { it.substring(3).trim() }
        def filesToStage = changedFiles.findAll { changedFile ->
            checkList.any { check -> changedFile.contains(check) }
        }
        services.get(ExecOperations).exec {
            workingDir gitRootDir
            commandLine = ['git', 'add'] + filesToStage
        }
        services.get(ExecOperations).exec {
            workingDir gitRootDir
            commandLine = ['git', 'commit', '-m', "Auto-commit: update in ${filesToStage.join(', ')}"]
            ignoreExitValue = true
        }
    }
}

def cleanBeforeTasks = ['compile', 'compileTests', 'compileFunctionalTests', 'native2ascii', 'generateJooq']
cleanBeforeTasks.each { taskName ->
    tasks.named(taskName) {
        doFirst {
            outputs.files.each { outputFile ->
                if (outputFile.exists()) {
                    outputFile.delete()
                }
                outputFile.mkdirs()
            }
        }
    }
}