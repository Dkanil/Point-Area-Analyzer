services:
  backend:
    build: ./backend
    container_name: backend
    ports:
      - "8080:8080"
      - "9010:9010"
      - "9011:9011"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/studs
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=admin
    env_file:
      - ./backend/jmxRemoteConfig/jmx-secured.env
    volumes:
      - ./backend/jmxRemoteConfig/jmx.keystore:/jmxRemoteConfig/jmx.keystore
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/auth/health" ]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      - POSTGRES_DB=studs
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "4200:4200"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--spider", "http://0.0.0.0:4200" ]
      interval: 5s
      timeout: 5s
      retries: 5

  functional-tests:
    profiles:
      - functional-test
    build:
      context: ./backend
      dockerfile: src/functionalTest/Dockerfile
    container_name: functional-tests
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/studs
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=admin
      - FRONTEND_BASE_URL=http://frontend:4200
      - BACKEND_BASE_URL=http://backend:8080
    volumes:
      - ./backend/build/reports:/app/build/reports
      - gradle_cache:/root/.gradle

volumes:
  postgres_data:
  gradle_cache:
